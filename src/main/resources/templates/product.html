<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name}">Product</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <a th:href="@{/}">&larr; Back to products</a>

    <div class="detail">
        <img th:src="${product.imageUrl}" th:alt="${product.name}">
        <div>
            <h1 th:text="${product.name}">Name</h1>
            <p class="price">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">0.00</span></p>
            <p th:text="${product.description}">Description</p>
            <p class="muted" th:if="${product.stock > 0}" th:text="${product.stock} + ' in stock'"></p>
            <p class="out" th:if="${product.stock == 0}">Out of stock</p>

            <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" th:if="${product.stock > 0}">
                <label>Quantity
                    <input type="number" name="qty" value="1" min="1" th:max="${product.stock}">
                </label>
                <button type="submit">Add to Cart</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
