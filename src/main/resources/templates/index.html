<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Shop</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <div th:replace="~{fragments :: messages}"></div>

    <h1 th:text="${q != null and !q.isBlank()} ? 'Results for &quot;' + ${q} + '&quot;' : 'All Products'">All Products</h1>

    <p th:if="${products.isEmpty()}">No products found.</p>

    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <a th:href="@{/product/{id}(id=${p.id})}">
                <img th:src="${p.imageUrl}" th:alt="${p.name}">
            </a>
            <div class="card-body">
                <h3><a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}">Name</a></h3>
                <p class="price">₹<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">0.00</span></p>
                <p class="muted" th:if="${p.stock > 0}" th:text="${p.stock} + ' in stock'"></p>
                <p class="out" th:if="${p.stock == 0}">Out of stock</p>
                <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" th:if="${p.stock > 0}">
                    <button type="submit">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
